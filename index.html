<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><div><h1>ImageDropper</h1><p>Web Image → Premiere</p></div><button id="settingsToggle" class="ghost" type="button" aria-expanded="false">Settings</button></header>
    <form id="importForm">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" type="text" inputmode="url" placeholder="https://example.com/image.jpg" autocomplete="url" spellcheck="false">
      <button id="importButton" class="primary" type="submit">Import Image</button>
    </form>
    <section id="settings" hidden aria-label="Settings">
      <h2>Settings</h2>
      <label>Image Storage Folder</label>
      <p id="folderPath">Documents/ImageDropper/Images (select Documents on first use)</p>
      <button id="chooseFolder" type="button">Choose another folder</button>
      <label class="check"><input id="duplicates" type="checkbox" checked> Reuse downloads from the same URL</label>
    </section>
    <section class="status" role="status" aria-live="polite" aria-atomic="true">
      <h2>Status</h2><strong id="statusTitle">Ready</strong><p id="statusDetail"></p>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
